name: Release v4.15.0
on:
  push:
    tags:
      - v4.15.0-kelaner
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:native
      - run: pnpm run build
      - run: pnpm exec electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/vnite-4.15.0-setup.exe `
            dist/vnite-4.15.0-setup.exe.blockmap `
            --target $env:GITHUB_SHA `
            --title 'Vnite 4.15.0 - kelaner edition' `
            --notes 'Merged upstream Vnite 4.15.0. Includes Bangumi personal token support, original-title-first metadata search, score-source grouping, configurable batch-update interval, and upstream game-selection improvements. Windows installer is unsigned.'
