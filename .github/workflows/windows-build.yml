name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Prefer original titles for metadata updates'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: vnite-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v4.14.1-original-title dist/vnite-4.14.1-setup.exe dist/vnite-4.14.1-setup.exe.blockmap --target $env:GITHUB_SHA --title 'Vnite 4.14.1 - original title search' --notes 'Metadata updates prefer the original game title when searching, falling back to the localized title. Includes Bangumi access token support and scraper scores. Windows installer is unsigned.'
