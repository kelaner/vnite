name: Windows build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: vnite-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
      - name: Publish release
        run: gh release create v4.14.1-score dist/vnite-4.14.1-setup.exe dist/vnite-4.14.1-setup.exe.blockmap --target $env:GITHUB_SHA --title 'Vnite 4.14.1 - scraper scores' --notes '基于 Vnite 4.14.1，包含上游 PR #709 的外部评分功能。评分抓取默认关闭，可在设置中启用。Windows 安装包未经代码签名。'
        env:
          GH_TOKEN: ${{ github.token }}
